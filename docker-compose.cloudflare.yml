# Requires Docker Compose 2.24.4 or later. Use together with docker-compose.yml.
x-cloudflare-environment: &cloudflare-environment
  ENVIRONMENT: production
  API_PUBLIC_URL: https://${CLOUDFLARE_PUBLIC_HOSTNAME:-api.huertoconnect.com}
  FRONTEND_URL: https://${CLOUDFLARE_FRONTEND_HOSTNAME:-huertoconnect.com}
  FRONTEND_ORIGIN: https://${CLOUDFLARE_FRONTEND_HOSTNAME:-huertoconnect.com}
  CORS_ORIGINS: ${CLOUDFLARE_CORS_ORIGINS:-https://${CLOUDFLARE_FRONTEND_HOSTNAME:-huertoconnect.com},https://www.${CLOUDFLARE_FRONTEND_HOSTNAME:-huertoconnect.com},https://${CLOUDFLARE_ADMIN_HOSTNAME:-admin.${CLOUDFLARE_FRONTEND_HOSTNAME:-huertoconnect.com}},https://${CLOUDFLARE_PUBLIC_HOSTNAME:-api.huertoconnect.com}}
  OTP_DELIVERY_MODE: smtp
  OTP_EXPOSE_CODE_IN_RESPONSE: "false"
  # env_file in the base includes .env; clear the token in application services.
  CLOUDFLARE_TUNNEL_TOKEN: ""

services:
  auth-service:
    ports: !reset []
    environment: *cloudflare-environment

  huertos-service:
    ports: !reset []
    environment: *cloudflare-environment

  plagas-service:
    ports: !reset []
    environment: *cloudflare-environment

  chat-service:
    ports: !reset []
    environment: *cloudflare-environment

  reportes-service:
    ports: !reset []
    environment: *cloudflare-environment

  agent-service:
    ports: !reset []
    environment:
      ENVIRONMENT: production
      CLOUDFLARE_TUNNEL_TOKEN: ""

  gateway:
    ports: !override
      - "127.0.0.1:8000:8000"
    environment: *cloudflare-environment
    # Incoming connections originate from the tunnel container or local host.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:2000", "run", "--token-file", "/run/secrets/cloudflare_tunnel_token"]
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - huerto-network
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

secrets:
  cloudflare_tunnel_token:
    environment: CLOUDFLARE_TUNNEL_TOKEN
