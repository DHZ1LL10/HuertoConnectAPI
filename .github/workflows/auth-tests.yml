name: Auth service tests
on:
  push:
    paths:
      - 'auth-service/**'
      - 'shared/**'
      - 'tests/test_auth_service.py'
      - 'tests/conftest.py'
      - '.github/workflows/auth-tests.yml'
  pull_request:
    paths:
      - 'auth-service/**'
      - 'shared/**'
      - 'tests/test_auth_service.py'
      - 'tests/conftest.py'
      - '.github/workflows/auth-tests.yml'
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'auth-service/requirements*.txt'
      - run: pip install -r auth-service/requirements-dev.txt
      - run: python -m pytest tests/test_auth_service.py -q
