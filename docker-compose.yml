x-service-environment: &service-environment
  MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
  MONGO_DB: ${MONGO_DB}
  POSTGRES_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}

services:
  # ===================== DATABASES =====================
  mongodb:
    image: mongo:7
    container_name: huerto-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    # Puerto no expuesto al host — los servicios se conectan por red interna Docker
    volumes:
      - mongo_data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - huerto-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: huerto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Puerto no expuesto al host — los servicios se conectan por red interna Docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro
    networks:
      - huerto-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================== MICROSERVICES =====================
  auth-service:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready', timeout=15)"]
      interval: 15s
      timeout: 20s
      retries: 12
      start_period: 60s
    environment: *service-environment
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: huerto-auth
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - huerto-network

  huertos-service:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/ready', timeout=15)"]
      interval: 15s
      timeout: 20s
      retries: 12
      start_period: 60s
    environment: *service-environment
    build:
      context: .
      dockerfile: huertos-service/Dockerfile
    container_name: huerto-huertos
    restart: unless-stopped
    env_file: .env
    ports:
      - "8002:8002"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - huerto-network

  plagas-service:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health/ready', timeout=15)"]
      interval: 15s
      timeout: 20s
      retries: 12
      start_period: 60s
    environment:
      <<: *service-environment
      PLAGUE_MODEL_PATH: /models/vision/yolo_plagas_veracruz_v6.pt
      DISEASE_MODEL_PATH: /models/vision/yolo_enfermedades_veracruz_v6.pt
      RF_MODEL_PATH: /models/random_forest/random_forest_veracruz.joblib
      AI_DEVICE: ${AI_DEVICE:-cpu}
    volumes:
      - ./plagas-service/app/models/ml:/models/vision:ro
      - ./huertos-service/app/models/ml:/models/random_forest:ro
    build:
      context: .
      dockerfile: plagas-service/Dockerfile
    container_name: huerto-plagas
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - huerto-network

  chat-service:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health/ready', timeout=15)"]
      interval: 15s
      timeout: 20s
      retries: 12
      start_period: 60s
    environment: *service-environment
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    container_name: huerto-chat
    restart: unless-stopped
    env_file: .env
    ports:
      - "8004:8004"
    depends_on:
      agent-service:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - huerto-network

  reportes-service:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health/ready', timeout=15)"]
      interval: 15s
      timeout: 20s
      retries: 12
      start_period: 60s
    environment: *service-environment
    build:
      context: .
      dockerfile: reportes-service/Dockerfile
    container_name: huerto-reportes
    restart: unless-stopped
    env_file: .env
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - huerto-network

  gateway:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=15)"]
      interval: 15s
      timeout: 20s
      retries: 12
      start_period: 60s
    environment: *service-environment
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: huerto-gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      auth-service:
        condition: service_healthy
      huertos-service:
        condition: service_healthy
      plagas-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      reportes-service:
        condition: service_healthy
    networks:
      - huerto-network

  # =================== AGENT SERVICE (IA Local - Ollama) ===================
  agent-service:
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: agent-service/Dockerfile
    container_name: huerto-agent
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:1b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      OLLAMA_CONTEXT_WINDOW: ${OLLAMA_CONTEXT_WINDOW:-2048}
      OLLAMA_MAX_OUTPUT_TOKENS: ${OLLAMA_MAX_OUTPUT_TOKENS:-180}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      APP_API_KEY: ${AGENT_API_KEY:?Define AGENT_API_KEY}
      ALLOWED_HOSTS: "localhost,127.0.0.1,agent-service,agent,huerto-agent"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: "INFO"
    ports:
      - "127.0.0.1:8006:8006"
    networks:
      - huerto-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - huerto-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:1b}
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1 || ollama pull "$$OLLAMA_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - huerto-network

volumes:
  ollama_data:
  mongo_data:
  postgres_data:


networks:
  huerto-network:
    driver: bridge
